name: Refresh public activity

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/render_activity.py'
      - '.github/workflows/activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify renderer
        run: python -m unittest discover -s tests
      - name: Render public contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_activity.py
      - name: Commit only the generated visual
        run: |
          if git diff --quiet -- assets/contributions.svg assets/contributions-mobile.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/contributions.svg assets/contributions-mobile.svg
          git commit -m "chore: refresh public contribution field"
          git push

